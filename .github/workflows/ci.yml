name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: '1.85.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --all-targets
      - run: cargo test --doc

  release:
    name: Release tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --all-targets

  quality:
    name: Formatting, Clippy, and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: python3 scripts/validate_release.py --check
      - run: python3 scripts/reference_benchmarks.py --self-test
      - run: python3 scripts/prepare_audio_corpus.py --verify
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  references:
    name: Independent numerical references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/fixtures/requirements-reference.txt
      - run: python -m pip install -r tests/fixtures/requirements-reference.txt
      - run: python scripts/reference_benchmarks.py --check-fixtures
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numerical-reference-report
          path: |
            target/reference-report.json
            target/reference-report.log

  performance:
    name: Performance observations (no timing threshold)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python scripts/performance_benchmarks.py run --repetitions 5 --warmup 2 --allocation-repetitions 2 --rss --output target/performance-ci.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numerical-performance-report
          path: target/performance-ci.json
